<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MapFriends - World Explorer</title>
    
    <link rel="stylesheet" href="https://unpkg.com/jsvectormap/dist/css/jsvectormap.min.css" />
    
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #000000; /* Fundo preto para o espaço 3D */
            -webkit-font-smoothing: antialiased;
        }

        #globeViz, #map-container-2d {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
        }
        
        /* Oculta o 2D por padrão */
        #map-container-2d {
            display: none;
            background-color: #ffffff;
        }

        /* Oculta os botões de zoom nativos do 2D */
        .jvm-zoom-btn {
            display: none !important;
        }

        .top-bar {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 500px; z-index: 10;
            display: flex; gap: 10px; justify-content: center;
        }

        .list-btn, .map-select {
            background: rgba(255, 255, 255, 0.15); 
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 14px;
            padding: 12px; cursor: pointer; font-size: 15px; font-weight: 600;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: flex; align-items: center; gap: 8px;
            outline: none;
        }

        /* Estilo alternativo quando o mapa for 2D claro (para os botões não sumirem no branco) */
        .light-mode-ui .list-btn, .light-mode-ui .map-select {
            background: rgba(255, 255, 255, 0.85);
            color: #1c1c1e;
            border: 1px solid #d1d1d6;
        }
        .light-mode-ui .map-select option { background: #ffffff; color: #1c1c1e; }
        .light-mode-ui .list-btn svg { stroke: #1c1c1e; }

        .list-btn { padding: 12px 20px; }
        
        .map-select {
            appearance: none; -webkit-appearance: none; text-align: center;
        }
        .map-select option { background: #1c1c1e; color: #fff; }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            z-index: 9999; justify-content: center; align-items: flex-end; 
        }

        .modal-content {
            background: #ffffff; width: 100%; max-height: 85vh; border-radius: 24px 24px 0 0;
            padding: 24px; box-sizing: border-box; overflow-y: auto; -webkit-overflow-scrolling: touch; 
            animation: slideUp 0.35s cubic-bezier(0.1, 0.8, 0.2, 1);
        }

        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        h2 { margin: 0 0 4px 0; font-size: 24px; color: #1c1c1e; }
        p.subtitle { color: #8e8e93; font-size: 14px; margin: 0 0 20px 0; }
        
        button.close-btn {
            width: 100%; background: #f2f2f7; color: #007aff; padding: 16px; border: none; border-radius: 14px;
            font-size: 16px; margin-top: 16px; cursor: pointer; font-weight: 600;
        }

        .history-card { background: #f2f2f7; padding: 16px; border-radius: 16px; margin-bottom: 16px; border: 1px solid #e5e5ea; }
        .history-card h4 { margin: 0 0 12px 0; font-size: 18px; color: #1c1c1e; border-bottom: 1px solid #d1d1d6; padding-bottom: 8px;}
        .history-card p { margin: 6px 0; font-size: 15px; color: #3a3a3c; line-height: 1.4; }
        .history-card span { font-weight: 700; color: #007aff; }
        
        .loading-text { color: white; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 0; font-family: sans-serif;}
    </style>
</head>
<body>

    <div class="loading-text" id="loading-indicator">Loading World...</div>
    
    <div id="globeViz"></div>
    <div id="map-container-2d"></div>

    <div class="top-bar" id="ui-bar">
        <select id="map-style-selector" class="map-select">
            <option value="night">🌙 3D Dark</option>
            <option value="day">☀️ 3D Light</option>
            <option value="satellite">🛰️ 3D Satellite</option>
            <option value="2d">🗺️ 2D Original</option>
        </select>

        <button class="list-btn" id="view-all-btn">
            <svg id="menu-icon" viewBox="0 0 24 24" width="20" height="20" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <line x1="4" y1="9" x2="20" y2="9"></line>
                <line x1="4" y1="15" x2="20" y2="15"></line>
            </svg>
            Connections
        </button>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <h2 id="country-title">🌍 Country Name</h2>
            <p class="subtitle">Cultural recommendations</p>
            <div id="previous-answers"></div>
            <button class="close-btn" type="button" onclick="closeModal()">Close</button>
        </div>
    </div>

    <div class="modal-overlay" id="all-responses-modal">
        <div class="modal-content">
            <h2>🌍 Connections</h2>
            <p class="subtitle">Everyone you've met globally (A-Z)</p>
            <div id="all-responses-list"></div>
            <button class="close-btn" type="button" onclick="closeAllResponsesModal()">Close</button>
        </div>
    </div>

    <script src="https://unpkg.com/globe.gl"></script>
    <script src="https://unpkg.com/jsvectormap"></script>
    <script src="https://unpkg.com/jsvectormap/dist/maps/world.js"></script>

        const API_URL = "
